# Sahkopostimalli
# ---------------------------------------------------------------------------
email:
  subject_prefix: "Hankintailmot"
  to: "HKI.MARKETING@twobirds.com; Maria Carlsson"
  cc: "HKI.STUDENT@twobirds.com; Maria Carlsson"
  greeting: "Hei!"
